<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MELIS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:360px;height:640px;transform-origin:center center;overflow:hidden;background:#0a0620;border-radius:6px}
#c{position:absolute;left:0;top:0;width:360px;height:640px;display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(8,4,24,.92);z-index:4}
.hidden{display:none!important}
.title{font-size:62px;font-weight:900;letter-spacing:4px;line-height:1.05;background:linear-gradient(180deg,#ffd1e3,#ff4f86);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a0f2e)}
.title.small{font-size:32px;letter-spacing:2px}
.sub{font-size:15px;color:#cdb7ff;line-height:1.4}
.btn{font:inherit;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(180deg,#ff6b9a,#e0245e);border:3px solid #3a0a22;border-radius:999px;padding:12px 38px;box-shadow:0 5px 0 #3a0a22;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3a0a22}
.file{display:block;font-size:13px;color:#cdb7ff;border:1px dashed #6b55a8;border-radius:10px;padding:8px 10px;margin:2px 0;cursor:pointer;width:260px}
.file input{display:block;margin-top:6px;font-size:12px;color:#fff;max-width:240px}
.hint{font-size:12px;color:#8f7fc0;line-height:1.4}
#storyText{font-size:18px;line-height:1.45;min-height:112px;color:#ffe9f1;display:flex;align-items:center;justify-content:center}
#dots{font-size:13px;color:#8f7fc0}
#endText{font-size:15.5px;line-height:1.4;color:#ffe3ef}
#endStats{font-size:13px;color:#cdb7ff}
#toast{position:absolute;left:12px;right:12px;top:62px;text-align:center;font-weight:700;font-size:14px;background:rgba(20,8,40,.85);border:2px solid #ff6b9a;border-radius:12px;padding:8px 10px;z-index:3;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.hero{display:flex;gap:10px;align-items:center;justify-content:center}
.hero img{width:136px;height:132px;object-fit:cover;border-radius:14px;border:3px solid #ff6b9a;box-shadow:0 4px 0 #3a0a22}
#storyImg{height:200px;max-width:300px;object-fit:contain;border-radius:14px;border:3px solid #ff6b9a;background:#0a0620}
#endImg{height:104px;border-radius:14px;border:3px solid #ff6b9a}
#snd{position:absolute;right:8px;bottom:8px;z-index:6;font:inherit;font-size:11px;color:#cdb7ff;background:rgba(0,0,0,.45);border:1px solid #6b55a8;border-radius:8px;padding:4px 8px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="toast"></div>
  <button id="snd">Sonido: si</button>

  <div class="screen" id="menu">
    <div class="title">MELIS</div>
    <div class="sub">Un juego de besos, asteroides<br>y hamburguesas pendientes</div>
    <button class="btn" id="bPlay">Jugar</button>
    <div class="hero"><img id="mJ" alt="Jhon"><img id="mM" alt="Melis"></div>
    <div class="hint">Arrastra el dedo para mover la nave. Los besos salen solos.</div>
  </div>

  <div class="screen hidden" id="story">
    <img id="storyImg" alt="">
    <div id="storyText"></div>
    <div id="dots"></div>
    <button class="btn" id="bNext">Siguiente</button>
  </div>

  <div class="screen hidden" id="end">
    <img id="endImg" alt="">
    <div class="title small" id="endTitle"></div>
    <canvas id="burger" width="160" height="110"></canvas>
    <div id="endText"></div>
    <div id="endStats"></div>
    <button class="btn" id="bAgain">Jugar otra vez</button>
  </div>
</div>

  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;
    o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+d);
    g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);
    o.start(t);o.stop(t+d);
  }catch(e){}
}
document.getElementById('snd').addEventListener('click',function(e){
  soundOn=!soundOn;e.target.textContent='Sonido: '+(soundOn?'si':'no');
});

/* ---------- estrellas ---------- */
for(var i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:rnd(0.6,1.8),sp:rnd(18,70)});

/* ---------- dibujo de formas ---------- */
function heartPath(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x,y+s*0.9);
  ctx.bezierCurveTo(x-s*1.3,y,x-s*0.8,y-s*0.9,x,y-s*0.35);
  ctx.bezierCurveTo(x+s*0.8,y-s*0.9,x+s*1.3,y,x,y+s*0.9);
  ctx.closePath();
}

function face(x,y,u,mood,img){
  ctx.save();ctx.translate(x,y);
  ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#1a1020';
  ctx.lineWidth=Math.max(1.2,u*0.05);
  var R=u*(img?0.8:0.64);
  if(img){
    ctx.save();ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.clip();
    var s=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,-R,-R,R*2,R*2);
    if(mood==='kiss'){ctx.fillStyle='rgba(255,100,150,.18)';ctx.fillRect(-R,-R,R*2,R*2);}
    ctx.restore();
    ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
    ctx.restore();return;
  }else{
    ctx.fillStyle='#14101a';
    ctx.beginPath();ctx.ellipse(0,u*0.08,u*0.66,u*0.7,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e5a877';
    ctx.beginPath();ctx.ellipse(0,u*0.1,u*0.47,u*0.55,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#14101a';
    ctx.beginPath();
    ctx.moveTo(-u*0.5,u*0.02);
    ctx.quadraticCurveTo(-u*0.35,-u*0.62,0,-u*0.5);
    ctx.quadraticCurveTo(u*0.35,-u*0.62,u*0.5,u*0.02);
    ctx.quadraticCurveTo(u*0.28,-u*0.22,0,-u*0.38);
    ctx.quadraticCurveTo(-u*0.28,-u*0.22,-u*0.5,u*0.02);
    ctx.fill();
    ctx.strokeStyle='#a5663f';ctx.lineWidth=u*0.035;
    ctx.beginPath();ctx.moveTo(-u*0.03,u*0.15);ctx.lineTo(0,u*0.22);ctx.lineTo(u*0.04,u*0.21);ctx.stroke();
    ctx.strokeStyle='#1a1020';ctx.lineWidth=Math.max(1.2,u*0.05);
  }
  /* mejillas */
  ctx.fillStyle=mood==='angry'?'rgba(255,70,60,.5)':(mood==='kiss'?'rgba(255,90,130,.55)':'rgba(255,120,110,.25)');
  ctx.beginPath();ctx.arc(-u*0.27,u*0.22,u*0.1,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(u*0.27,u*0.22,u*0.1,0,7);ctx.fill();
  /* ojos */
  if(!img){
    if(mood==='kiss'){
      ctx.strokeStyle='#2a1810';ctx.lineWidth=u*0.06;
      ctx.beginPath();
      ctx.moveTo(-u*0.29,u*0.06);ctx.quadraticCurveTo(-u*0.2,-u*0.06,-u*0.11,u*0.06);
      ctx.moveTo(u*0.11,u*0.06);ctx.quadraticCurveTo(u*0.2,-u*0.06,u*0.29,u*0.06);
      ctx.stroke();
    }else{
      var ry=mood==='angry'?u*0.06:u*0.095;
      [-1,1].forEach(function(sg){
        ctx.fillStyle='#3a2216';
        ctx.beginPath();ctx.ellipse(sg*u*0.2,u*0.05,u*0.08,ry,0,0,7);ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(sg*u*0.2+u*0.025,u*0.05-ry*0.3,u*0.025,0,7);ctx.fill();
      });
    }
  }
  /* cejas */
  ctx.strokeStyle='#14101a';ctx.lineWidth=u*(mood==='angry'?0.085:0.05);
  ctx.beginPath();
  if(mood==='angry'){
    ctx.moveTo(-u*0.36,-u*0.22);ctx.lineTo(-u*0.07,-u*0.07);
    ctx.moveTo(u*0.36,-u*0.22);ctx.lineTo(u*0.07,-u*0.07);
  }else{
    ctx.moveTo(-u*0.3,-u*0.13);ctx.quadraticCurveTo(-u*0.2,-u*0.2,-u*0.1,-u*0.14);
    ctx.moveTo(u*0.1,-u*0.14);ctx.quadraticCurveTo(u*0.2,-u*0.2,u*0.3,-u*0.13);
  }
  ctx.stroke();
  /* boca */
  ctx.strokeStyle='#1a1020';
  if(mood==='angry'){
    ctx.fillStyle='#fff';ctx.lineWidth=u*0.045;
    ctx.beginPath();
    ctx.moveTo(-u*0.18,u*0.3);ctx.lineTo(u*0.18,u*0.3);ctx.lineTo(u*0.13,u*0.41);ctx.lineTo(-u*0.13,u*0.41);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,u*0.3);ctx.lineTo(0,u*0.41);
    ctx.moveTo(-u*0.09,u*0.3);ctx.lineTo(-u*0.07,u*0.41);
    ctx.moveTo(u*0.09,u*0.3);ctx.lineTo(u*0.07,u*0.41);
    ctx.stroke();
  }else if(mood==='kiss'){
    ctx.fillStyle='#e0245e';ctx.lineWidth=u*0.04;
    ctx.beginPath();ctx.ellipse(0,u*0.34,u*0.1,u*0.066,0,0,7);ctx.fill();ctx.stroke();
  }else{
    ctx.strokeStyle='#8a2f2f';ctx.lineWidth=u*0.05;
    ctx.beginPath();ctx.moveTo(-u*0.14,u*0.3);ctx.quadraticCurveTo(0,u*0.42,u*0.14,u*0.3);ctx.stroke();
  }
  ctx.restore();
}

function vein(x,y,s){
  ctx.strokeStyle='#e22';ctx.lineWidth=s*0.3;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-s,y-s/3);ctx.lineTo(x+s,y-s/3);
  ctx.moveTo(x-s,y+s/3);ctx.lineTo(x+s,y+s/3);
  ctx.moveTo(x-s/3,y-s);ctx.lineTo(x-s/3,y+s);
  ctx.moveTo(x+s/3,y-s);ctx.lineTo(x+s/3,y+s);
  ctx.stroke();
}

function puff(x,y,r){
  ctx.fillStyle='rgba(235,235,245,.85)';ctx.strokeStyle='rgba(30,20,40,.9)';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(x,y,r,0,7);ctx.arc(x+r*0.9,y+r*0.2,r*0.75,0,7);ctx.arc(x-r*0.8,y+r*0.3,r*0.7,0,7);
  ctx.fill();
}

function drawRock(k){
  ctx.save();ctx.translate(k.x,k.y);
  var sc=1,al=1;
  if(k.kissed){var q=Math.max(0,k.kt/0.6);sc=0.55+0.45*q;al=q;}
  ctx.globalAlpha=al;ctx.scale(sc,sc);
  ctx.save();ctx.rotate(k.rot);
  var n=k.shape.length;
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var a=i/n*Math.PI*2,rr=k.r*k.shape[i];
    var x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle=k.flash>0?'#ffd6e6':(k.angry?'#b4474b':'#8f8cab');
  ctx.fill();
  ctx.lineWidth=3;ctx.lineJoin='round';
  ctx.strokeStyle=k.angry?'#3d0f12':'#262140';ctx.stroke();
  ctx.fillStyle=k.angry?'rgba(60,10,14,.35)':'rgba(30,25,60,.3)';
  k.craters.forEach(function(c){ctx.beginPath();ctx.arc(c[0]*k.r*0.7,c[1]*k.r*0.7,c[2]*k.r*1.6,0,7);ctx.fill();});
  ctx.restore();
  var mood=k.angry?'angry':(k.kissed?'kiss':'happy');
  face(0,0,k.r*0.96,mood,k.angry?angryImg:melisImg);
  if(k.angry){
    vein(k.r*0.48,-k.r*0.5,k.r*0.12);
    var ph=(clock*1.6+k.ph)%1;
    ctx.globalAlpha=al*(1-ph*0.7);
    puff(-k.r*0.75,-k.r*0.7-ph*10,k.r*0.14);
    puff(k.r*0.75,-k.r*0.7-ph*10,k.r*0.14);
  }
  if(!k.angry&&k.hp>1){
    ctx.globalAlpha=al;
    heartPath(0,-k.r-6,4);ctx.fillStyle='#ff5c8a';ctx.fill();
    heartPath(10,-k.r-6,4);ctx.fill();
  }
  ctx.restore();
}

function jhonFace(x,y,u){
  ctx.save();ctx.translate(x,y);
  ctx.lineWidth=1.3;ctx.strokeStyle='#1a1020';
  if(jhonImg){
    var jh=u*2.3,jw=jh*jhonImg.width/jhonImg.height;
    ctx.drawImage(jhonImg,-jw/2,-jh/2,jw,jh);
  }else{
    ctx.fillStyle='#d79a6b';
    ctx.beginPath();ctx.arc(0,0,u,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#1a1410';
    ctx.beginPath();ctx.arc(0,-u*0.15,u*0.98,Math.PI*1.05,Math.PI*1.95);ctx.lineTo(u*0.6,-u*0.35);ctx.lineTo(0,-u*0.55);ctx.lineTo(-u*0.6,-u*0.35);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(0,u*0.25,u*0.62,0.15,Math.PI-0.15);ctx.arc(0,u*0.12,u*0.5,Math.PI-0.3,0.3,true);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1a1020';
    ctx.beginPath();ctx.arc(-u*0.33,-u*0.02,u*0.1,0,7);ctx.arc(u*0.33,-u*0.02,u*0.1,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(-u*0.22,u*0.38);ctx.quadraticCurveTo(0,u*0.58,u*0.22,u*0.38);ctx.stroke();
  }
  ctx.restore();
}

function drawShip(){
  if(inv>0&&Math.floor(inv*12)%2===0)return;
  ctx.save();ctx.translate(px,py);
  ctx.lineWidth=2.5;ctx.strokeStyle='#0b1f26';ctx.lineJoin='round';
  var f=10+Math.random()*8;

  ctx.fillStyle='#ff5a3c';
  ctx.beginPath();ctx.moveTo(-4,24);ctx.lineTo(0,24+f);ctx.lineTo(4,24);ctx.closePath();ctx.fill();
  ctx.fillStyle='#4fb3a9';
  ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-32,26);ctx.lineTo(-30,35);ctx.lineTo(-8,26);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(32,26);ctx.lineTo(30,35);ctx.lineTo(8,26);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#b9d3d9';
  ctx.beginPath();
  ctx.moveTo(0,-32);ctx.bezierCurveTo(15,-14,17,10,12,27);ctx.lineTo(-12,27);ctx.bezierCurveTo(-17,10,-15,-14,0,-32);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#e0245e';
  ctx.fillRect(-4,14,8,5);
  ctx.fillStyle='rgba(150,225,235,.95)';
  ctx.beginPath();ctx.arc(0,-5,13,0,7);ctx.fill();ctx.stroke();
  jhonFace(0,-5,10);
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,-5,11.5,Math.PI*1.1,Math.PI*1.4);ctx.stroke();
  ctx.restore();
}

function drawHud(){
  var i;
  for(i=0;i<3;i++){
    heartPath(18+i*22,20,7);
    ctx.fillStyle=i<lives?'#ff3d6e':'rgba(255,255,255,.15)';ctx.fill();

  var pi=meter>45?angryImg:melisImg;
  if(pi){
    ctx.save();ctx.beginPath();ctx.arc(W/2,19,15,0,7);ctx.clip();ctx.drawImage(pi,W/2-15,4,30,30);ctx.restore();
    ctx.lineWidth=2;ctx.strokeStyle=meter>45?'#ff4d4d':'#ff7aa5';ctx.beginPath();ctx.arc(W/2,19,15,0,7);ctx.stroke();

/* ---------- juego ---------- */
function reset(){
  hearts=[];rocks=[];parts=[];floats=[];
  px=tx=W/2;py=ty=520;fireT=0;spawnT=0.6;time=0;lives=3;meter=100;kisses=0;inv=0;shake=0;beat=0;
}

function spawn(){
  var p=1-meter/100;
  var angry=Math.random()<0.2+0.22*p;
  var r=angry?rnd(22,30):rnd(24,40);
  var shape=[],craters=[],i;
  for(i=0;i<11;i++)shape.push(rnd(0.88,1.08));
  for(i=0;i<3;i++)craters.push([rnd(-0.7,0.7),rnd(-0.7,0.7),rnd(0.1,0.22)]);
  rocks.push({
    x:r+Math.random()*(W-2*r),y:-r,r:r,vx:rnd(-25,25),
    vy:(52+p*50+Math.random()*34)*(angry?1.12:1),
    angry:angry,hp:(!angry&&r>34)?2:1,rot:Math.random()*6,vr:rnd(-0.6,0.6),
    shape:shape,craters:craters,kissed:false,kt:0,flash:0,dead:false,ph:Math.random()
  });
}

function addFloat(x,y,txt,col){floats.push({x:x,y:y,t:0,life:0.9,txt:txt,col:col});}
function emitKiss(x,y){
  for(var i=0;i<9;i++){
    var a=rnd(0,Math.PI*2),s=rnd(50,140);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:0.9,max:0.9,s:rnd(3,6),col:'#ff5c8a',heart:true});
  }
}
function emitPop(x,y,col){
  for(var i=0;i<7;i++){
    var a=rnd(0,Math.PI*2),s=rnd(40,120);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5,max:0.5,s:rnd(1.5,3),col:col,heart:false});
  }
}

function toast(txt){
  var t=document.getElementById('toast');
  t.textContent=txt;t.classList.add('show');
  clearTimeout(toast.h);
  toast.h=setTimeout(function(){t.classList.remove('show');},2800);
}

function kissRock(k){
  k.kissed=true;k.kt=0.6;k.vy*=0.2;k.vx=0;
  kisses++;meter=Math.max(0,meter-100/GOAL);
  emitKiss(k.x,k.y);addFloat(k.x,k.y-k.r,'MUA!','#ff7aa5');
  snd(500,1100,0.18,'triangle',0.08);
}

function hurt(){
  lives--;inv=1.6;shake=0.35;meter=Math.min(100,meter+8);
  snd(160,50,0.3,'sawtooth',0.1);
  addFloat(px,py-40,'AUCH','#ff4d4d');
  if(lives<=0)endGame(false);
}

var BEATS=[
  [0.25,'Melis suelta una risita. Sigue asi, Jhon.'],
  [0.5,'Ya no frunce el ceno. Casi la tienes.'],
  [0.75,'Se le escapa una sonrisa. Un esfuerzo mas.']
];

function update(dt){
  clock+=dt;
  stars.forEach(function(s){s.y+=s.sp*dt;if(s.y>H){s.y=0;s.x=Math.random()*W;}});
  var i,j;
  for(i=parts.length-1;i>=0;i--){
    var pt=parts[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;
    if(pt.life<=0)parts.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>floats[i].life)floats.splice(i,1);}
  if(shake>0)shake-=dt;
  if(state==='win'){
    confT-=dt;
    if(confT<=0){
      confT=0.07;
      parts.push({x:Math.random()*W,y:-10,vx:rnd(-20,20),vy:rnd(70,150),life:6,max:6,s:rnd(4,8),col:Math.random()<0.5?'#ff5c8a':'#ffd1e3',heart:true});
    }
    return;
  }
  if(state!=='play')return;

  time+=dt;
  if(inv>0)inv-=dt;
  var sp=320;
  if(keys.arrowleft||keys.a)tx-=sp*dt;
  if(keys.arrowright||keys.d)tx+=sp*dt;
  if(keys.arrowup||keys.w)ty-=sp*dt;
  if(keys.arrowdown||keys.s)ty+=sp*dt;
  tx=clamp(tx,22,W-22);ty=clamp(ty,330,H-40);
  px+=(tx-px)*Math.min(1,dt*16);py+=(ty-py)*Math.min(1,dt*16);

  var p=1-meter/100;
  fireT-=dt;
  if(fireT<=0){
    fireT=0.26;
    if(p>0.5){hearts.push({x:px-9,y:py-28,vy:-440});hearts.push({x:px+9,y:py-28,vy:-440});}
    else hearts.push({x:px,y:py-28,vy:-440});
    snd(900,1300,0.06,'sine',0.015);
  }
  spawnT-=dt;
  if(spawnT<=0){spawnT=Math.max(0.45,1.1-p*0.55)+Math.random()*0.25;spawn();}

  for(i=hearts.length-1;i>=0;i--){
    var h=hearts[i];h.y+=h.vy*dt;
    if(h.y<-20||h.dead)hearts.splice(i,1);
  }

  for(i=rocks.length-1;i>=0;i--){
    var k=rocks[i];
    k.rot+=k.vr*dt;
    if(k.flash>0)k.flash-=dt;
    if(k.kissed){
      k.kt-=dt;k.y+=k.vy*dt;
      if(k.kt<=0)rocks.splice(i,1);
      continue;
    }
    k.y+=k.vy*dt;k.x+=k.vx*dt;
    if(k.x<k.r){k.x=k.r;k.vx=Math.abs(k.vx);}
    if(k.x>W-k.r){k.x=W-k.r;k.vx=-Math.abs(k.vx);}
    if(k.dead){rocks.splice(i,1);continue;}
    if(k.y>H+k.r){
      if(!k.angry){
        meter=Math.min(100,meter+2);
        addFloat(clamp(k.x,30,W-30),H-30,'se escapo','#ffb3c8');
      }
      rocks.splice(i,1);
    }
  }

  for(i=0;i<hearts.length;i++){
    var hh=hearts[i];
    for(j=0;j<rocks.length;j++){
      var r=rocks[j];
      if(r.kissed||r.dead)continue;
      if(Math.hypot(hh.x-r.x,hh.y-r.y)<r.r*0.85+7){
        hh.dead=true;
        if(r.angry){
          meter=Math.min(100,meter+3);
          addFloat(r.x,r.y-r.r,'NO!','#ff7070');
          emitPop(hh.x,hh.y,'#ff7070');
          snd(300,200,0.1,'square',0.04);
        }else{
          r.hp--;r.flash=0.12;
          if(r.hp<=0)kissRock(r);
          else{emitPop(hh.x,hh.y,'#ff9ec0');snd(700,900,0.08,'triangle',0.05);}
        }
        break;
      }
    }
  }

  for(j=0;j<rocks.length;j++){
    var q=rocks[j];
    if(q.kissed||q.dead)continue;
    if(Math.hypot(px-q.x,py-q.y)<q.r*0.8+13){
      if(q.angry){
        if(inv<=0){q.dead=true;emitPop(q.x,q.y,'#ff5050');hurt();}
      }else{
        kissRock(q);
      }
    }
  }

  while(beat<BEATS.length&&(1-meter/100)>=BEATS[beat][0]){toast(BEATS[beat][1]);beat++;}
  if(state==='play'&&meter<=0)endGame(true);
}

function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0620');g.addColorStop(1,'#1c0b33');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(state==='play'){ctx.fillStyle='rgba(255,40,80,'+(meter/100*0.14)+')';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='#fff';
  stars.forEach(function(s){ctx.globalAlpha=0.4+s.s*0.3;ctx.fillRect(s.x,s.y,s.s,s.s);});
  ctx.globalAlpha=1;
  ctx.save();
  if(shake>0)ctx.translate(rnd(-4,4),rnd(-4,4));
  rocks.forEach(drawRock);
  hearts.forEach(function(h){
    heartPath(h.x,h.y,8);ctx.fillStyle='#ff4f86';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='#4a0a24';ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(h.x-3,h.y-3,1.6,0,7);ctx.fill();
  });
  parts.forEach(function(p){
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;
    if(p.heart){heartPath(p.x,p.y,p.s);ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}
  });
  ctx.globalAlpha=1;
  if(state==='play')drawShip();
  floats.forEach(function(f){
    ctx.globalAlpha=Math.max(0,1-f.t/f.life);
    ctx.font='bold 16px "Trebuchet MS",sans-serif';ctx.textAlign='center';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';
    ctx.strokeText(f.txt,f.x,f.y-f.t*40);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-f.t*40);
  });
  ctx.globalAlpha=1;
  ctx.restore();
  if(state==='play')drawHud();
}

var last=0;
function frame(t){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(t-last)/1000||0);last=t;
  update(dt);draw();
}
requestAnimationFrame(frame);

/* ---------- pantallas ---------- */
var menu=document.getElementById('menu'),story=document.getElementById('story'),endS=document.getElementById('end');
var STORY=[
  'Me descuidé y cogí el pedido que no era. Melis no pudo comer sus hamburguesas y perdimos la plata.',
  'Ahora Melis está furiosa. Su enojo flota por el espacio convertido en asteroides.',
  'Tu nave tiene una sola arma: corazones. Cada corazón que le des a un asteroide es un beso para ella.',
  'Cuidado con las caras enojadas. Esas no se calman con besos: solo se esquivan.',
  'Bájale el enojo a cero antes de quedarte sin vidas. Y después, prometido: hamburguesas apenas te paguen.'
];
var STORY_IMG=['jhon_cockpit','angry_full','jhon_ship','angry_face','melis_cockpit'];
var sIdx=0,typing=false,typeTimer=null;

function typeStory(){
  var el=document.getElementById('storyText'),txt=STORY[sIdx],n=0;
  document.getElementById('dots').textContent=(sIdx+1)+' / '+STORY.length;
  document.getElementById('storyImg').src=ASSETS[STORY_IMG[sIdx]];
  document.getElementById('bNext').textContent=sIdx===STORY.length-1?'A pelear':'Siguiente';
  el.textContent='';typing=true;clearInterval(typeTimer);
  typeTimer=setInterval(function(){
    n++;el.textContent=txt.slice(0,n);
    if(n>=txt.length){clearInterval(typeTimer);typing=false;}
  },32);
}
function finishTyping(){
  clearInterval(typeTimer);typing=false;
  document.getElementById('storyText').textContent=STORY[sIdx];
}

document.getElementById('bPlay').addEventListener('click',function(){
  snd(600,900,0.1,'triangle',0.06);
  menu.classList.add('hidden');story.classList.remove('hidden');
  sIdx=0;typeStory();
});
document.getElementById('bNext').addEventListener('click',function(){
  if(typing){finishTyping();return;}
  sIdx++;
  if(sIdx>=STORY.length)startGame();else typeStory();
});
document.getElementById('bAgain').addEventListener('click',startGame);

function startGame(){
  story.classList.add('hidden');endS.classList.add('hidden');
  reset();state='play';
  toast('Arrastra el dedo para mover la nave. Los besos salen solos.');
}

function endGame(won){
  if(won){
    state='win';rocks=[];hearts=[];
    snd(523,523,0.15,'triangle',0.08);
    setTimeout(function(){snd(659,659,0.15,'triangle',0.08);},160);
    setTimeout(function(){snd(784,784,0.25,'triangle',0.08);},320);
    setTimeout(function(){snd(1046,1046,0.4,'triangle',0.08);},560);
  }else{
    state='over';
  }
  setTimeout(function(){showEnd(won);},won?1100:700);
}

function showEnd(won){
  endS.classList.remove('hidden');
  document.getElementById('endImg').src=won?ASSETS.melis_cockpit:ASSETS.angry_face;
  document.getElementById('endTitle').textContent=won?'MELIS TE PERDONO':'Melis sigue enojada';
  document.getElementById('burger').style.display=won?'block':'none';
  document.getElementById('endText').textContent=won
    ?'Perdón amor, me descuidé y cogí el pedido que no era. Por eso no pudiste comer hamburguesas y perdimos la plata. Te prometo unas hamburguesas apenas me paguen.'
    :'Se te acabaron las vidas y su enojo sigue ahi. Respira, Jhon, y vuelve a intentarlo.';
  document.getElementById('endStats').textContent='Besos dados: '+kisses+'   Tiempo: '+Math.round(time)+' s';
  document.getElementById('bAgain').textContent=won?'Jugar otra vez':'Reintentar';
  if(won)drawBurger();
}

function drawBurger(){
  var c=document.getElementById('burger'),g=c.getContext('2d');
  g.clearRect(0,0,160,110);g.lineWidth=3;g.strokeStyle='#3a2210';g.lineJoin='round';
  g.fillStyle='#e0a24d';
  g.beginPath();g.moveTo(22,82);g.lineTo(138,82);g.quadraticCurveTo(138,104,116,104);g.lineTo(44,104);g.quadraticCurveTo(22,104,22,82);g.closePath();g.fill();g.stroke();
  g.fillStyle='#6b3a1e';
  g.beginPath();g.moveTo(24,66);g.lineTo(136,66);g.quadraticCurveTo(148,74,136,83);g.lineTo(24,83);g.quadraticCurveTo(12,74,24,66);g.closePath();g.fill();g.stroke();
  g.fillStyle='#f6c431';
  g.beginPath();g.moveTo(22,62);g.lineTo(138,62);g.lineTo(124,76);g.lineTo(104,65);g.lineTo(80,78);g.lineTo(58,65);g.lineTo(38,76);g.closePath();g.fill();g.stroke();
  g.fillStyle='#5fbf4a';
  g.beginPath();g.moveTo(14,56);
  g.quadraticCurveTo(30,46,46,56);g.quadraticCurveTo(62,66,78,56);g.quadraticCurveTo(94,46,110,56);g.quadraticCurveTo(126,66,146,56);
  g.lineTo(144,62);g.lineTo(16,62);g.closePath();g.fill();g.stroke();
  g.fillStyle='#e8a54b';
  g.beginPath();g.moveTo(18,54);g.bezierCurveTo(18,0,142,0,142,54);g.closePath();g.fill();g.stroke();
  g.fillStyle='#fff1cc';
  [[50,24],[72,15],[96,20],[116,32],[84,34],[38,40],[62,40]].forEach(function(s){
    g.beginPath();g.ellipse(s[0],s[1],4,2.3,0.4,0,7);g.fill();
  });
}

/* ---------- entrada ---------- */
function pointer(e){
  if(state!=='play')return;
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  tx=clamp(x,22,W-22);
  ty=clamp(e.pointerType==='touch'?y-70:y,330,H-40);
}
cv.addEventListener('pointerdown',function(e){pointer(e);try{cv.setPointerCapture(e.pointerId);}catch(x){}});
cv.addEventListener('pointermove',pointer);
window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key.indexOf('Arrow')===0)e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
document.addEventListener('contextmenu',function(e){e.preventDefault();});

function loadAsset(k,cb){var im=new Image();im.onload=function(){cb(im);};im.src=ASSETS[k];}
loadAsset('melis_face',function(im){melisImg=im;});
loadAsset('angry_face',function(im){angryImg=im;});
loadAsset('jhon_face',function(im){jhonImg=im;});
document.getElementById('mJ').src=ASSETS.jhon_cockpit;
document.getElementById('mM').src=ASSETS.melis_cockpit;
})();
